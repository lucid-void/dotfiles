name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and chezmoi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # scripts/lint.sh does the work so a local run and CI cannot drift: it
      # renders every .tmpl through chezmoi in both isDesktop modes, checks each
      # rendered script parses, and shellchecks the lot.
      - name: Lint
        run: ./scripts/lint.sh
