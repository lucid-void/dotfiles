# ── Prefix ─────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"

# Match any outer terminal, not just xterm-256color. This used to be
# ",xterm-256color:RGB", which only worked because .zshrc forced
# TERM=xterm-256color. That export is gone (the terminal owns TERM), so the
# override has to be wildcarded or ghostty (xterm-ghostty) and alacritty
# (alacritty) silently lose truecolor.
set -ag terminal-overrides ",*:RGB"

set -g history-limit 50000
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Default is 750ms, which is too short to read the `bind r` reload message.
set -g display-time 2000

# Default is 15s. status-right is a %H:%M clock, so three out of every four
# redraws change nothing — wasted round trips on the SSH/headless targets.
set -g status-interval 60

# Let kitty-graphics/sixel escape sequences through to the outer terminal.
# Unrelated to the OSC 52 clipboard below, which works without this.
#
# Also what carries Claude Code's desktop notification and progress-bar escapes
# out to ghostty/kitty; without it tmux swallows both and a finished task never
# announces itself. That holds over SSH too — the notification is an escape
# sequence, so it surfaces on whichever machine is drawing the terminal.
set -g allow-passthrough on

# Tell the outer terminal to send Shift+Enter as a distinct key (CSI-u extended
# keys) and pass it through, rather than folding it into a plain CR. Claude Code
# reads that to insert a newline in the prompt instead of submitting it; tmux is
# the reason this breaks even in ghostty/kitty, which handle Shift+Enter fine on
# their own. .config/alacritty/alacritty.toml carries the matching binding for
# the one terminal here that also needs it outside tmux.
#
# The leading comma matches the `terminal-overrides` append above — both options
# are comma-separated arrays and tmux drops the empty leading field, so this
# lands as a fourth `terminal-features` entry rather than being glued onto the
# xterm one (checked with `tmux -L` against a throwaway server). Nothing else
# here uses extended keys, so if some key ever starts arriving as a stray
# escape, this pair is the first suspect — `tmux show -s extended-keys`.
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# Copy to the system clipboard via OSC 52. Works through SSH and inside
# Codespaces, with no wl-copy/xclip dependency — which matters because this
# config also has to run on headless boxes.
set -g set-clipboard on

# install.sh skips `chsh` when it has no root/passwordless sudo (Codespaces is
# the common case), so tmux would inherit bash there. Prefer zsh when present;
# if neither path exists tmux falls back to $SHELL as before.
if-shell '[ -x /bin/zsh ]'     'set -g default-shell /bin/zsh'
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'

# ── Key bindings ───────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Stock `c` is a bare new-window, which would drop you back in $HOME while the
# splits above keep the current directory. Match them.
bind c new-window -c "#{pane_current_path}"

# Window cycling. Space was tmux's default next-layout binding, which this
# replaces — note M-1..M-5 only jump to the five preset layouts, they don't
# cycle the way next-layout did. Left non-repeating to match tmux's own n/p.
bind BSpace previous-window
bind Enter previous-window
bind Space next-window

# `l` below takes over tmux's default last-window binding, so put it back here.
# C-a C-a is already taken by send-prefix.
bind a last-window

# Vim-style pane navigation. -r to match the resize binds underneath, so a
# run of moves only needs the prefix once.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status bar ─────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#24273a,fg=#cad3f5"
set -g status-left "#[fg=#24273a,bg=#8aadf4,bold] #S #[fg=#8aadf4,bg=#24273a]"
set -g status-right "#[fg=#363a4f,bg=#24273a]#[fg=#cad3f5,bg=#363a4f] %H:%M #[fg=#8aadf4,bg=#363a4f]#[fg=#24273a,bg=#8aadf4,bold] #h "
set -g status-left-length 30
set -g status-right-length 50

# The zoom marker is a plain `Z`, not a Nerd Font glyph — the headless targets
# don't get the fonts that run_once_install_fonts.sh lays down on desktops.
setw -g window-status-format "#[fg=#6e738d,bg=#24273a] #I:#W#{?window_zoomed_flag,Z,} "
setw -g window-status-current-format "#[fg=#24273a,bg=#c6a0f6]#[fg=#24273a,bg=#c6a0f6,bold] #I:#W#{?window_zoomed_flag,Z,} #[fg=#c6a0f6,bg=#24273a]"

# Pane borders, messages and copy-mode selection were left at tmux defaults
# (green/yellow), which clashed with the Catppuccin Macchiato status bar above.
set -g pane-border-style        "fg=#494d64"
set -g pane-active-border-style "fg=#c6a0f6"
set -g message-style            "bg=#363a4f,fg=#cad3f5"
set -g message-command-style    "bg=#363a4f,fg=#cad3f5"
set -g mode-style               "bg=#494d64,fg=#cad3f5"

# ── Copy mode (vi) ─────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
