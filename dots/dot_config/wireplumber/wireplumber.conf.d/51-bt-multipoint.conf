# Bluetooth multipoint stability (Sonos Ace + Intel AX211)

wireplumber.settings = {
  # Don't yank the link into HFP when something opens a mic. Renegotiating
  # A2DP -> HFP on a multipoint link usually fails outright and kills audio.
  # The headset mic is still selectable by hand from the profile list.
  bluetooth.autoswitch-to-headset-profile = false

  # Remember the chosen profile/codec across reconnects.
  bluetooth.use-persistent-storage = true
}

monitor.bluez.properties = {
  # Drop aptX HD (576 kbps) and aptX. With two hosts the headset halves the
  # airtime it gives each link; AAC (~256 kbps) negotiates and holds far more
  # reliably. Order here doesn't pick the codec - removing the others does.
  bluez5.codecs = [ aac sbc_xq sbc msbc ]
  bluez5.enable-sbc-xq = true
}
