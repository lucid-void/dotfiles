# kitty — desktop only.
#
# Kept in step with alacritty.toml and ghostty/config: same font, same size,
# same padding, same theme, same scrollback, same copy-on-select, same
# background opacity. Whichever terminal you open should look and behave
# identically.
#
# This host already had a live ~/.config/kitty/kitty.conf using fish,
# JetBrains Mono Nerd Font and a quickshell-generated theme — none of which
# match this repo's conventions, so none of it was carried over. That file
# gets replaced by this one on the next `chezmoi apply`.

include catppuccin-macchiato.conf

font_family MesloLGS NF
font_size 14.0

window_padding_width 2

# No `map` for Claude Code here on purpose. Shift+Enter already inserts a
# newline in its prompt rather than submitting — kitty originated the keyboard
# protocol that makes the two distinguishable, so `/terminal-setup` writes
# nothing for it. Kitty is also one of the three terminals Claude Code sends a
# real desktop notification to (ghostty and iTerm2 are the others) instead of
# ringing the bell, so `preferredNotifChannel` can stay unset. Both facts stop
# being true inside tmux — see .config/tmux/tmux.conf. Alacritty needs an
# explicit binding; see its config.

# Matches `set -g history-limit 50000` in .tmux.conf and alacritty's
# `history = 50000` — kitty measures scrollback in lines, so exact parity is
# possible here (unlike ghostty, which measures in bytes).
scrollback_lines 50000

mouse_hide_wait 3

# Selecting text copies it to the system clipboard, not just the primary
# (middle-click-paste) selection — matches alacritty's
# `selection.save_to_clipboard = true` and ghostty's
# `copy-on-select = clipboard`.
copy_on_select clipboard

# See-through background. Same value as alacritty's `window.opacity` and
# ghostty's `background-opacity`. True blur is a Hyprland compositor concern
# (window rules), not a per-terminal setting, and isn't configured here.
background_opacity 0.5
