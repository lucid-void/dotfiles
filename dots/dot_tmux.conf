# ── Prefix ─────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"

# Match any outer terminal, not just xterm-256color. This used to be
# ",xterm-256color:RGB", which only worked because .zshrc forced
# TERM=xterm-256color. That export is gone (the terminal owns TERM), so the
# override has to be wildcarded or ghostty (xterm-ghostty) and alacritty
# (alacritty) silently lose truecolor.
set -ag terminal-overrides ",*:RGB"

set -g history-limit 50000
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Copy to the system clipboard via OSC 52. Works through SSH and inside
# Codespaces, with no wl-copy/xclip dependency — which matters because this
# config also has to run on headless boxes.
set -g set-clipboard on

# install.sh skips `chsh` when it has no root/passwordless sudo (Codespaces is
# the common case), so tmux would inherit bash there. Prefer zsh when present;
# if neither path exists tmux falls back to $SHELL as before.
if-shell '[ -x /bin/zsh ]'     'set -g default-shell /bin/zsh'
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'

# ── Key bindings ───────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status bar ─────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#24273a,fg=#cad3f5"
set -g status-left "#[fg=#24273a,bg=#8aadf4,bold] #S #[fg=#8aadf4,bg=#24273a]"
set -g status-right "#[fg=#363a4f,bg=#24273a]#[fg=#cad3f5,bg=#363a4f] %H:%M #[fg=#8aadf4,bg=#363a4f]#[fg=#24273a,bg=#8aadf4,bold] #h "
set -g status-left-length 30
set -g status-right-length 50

setw -g window-status-format "#[fg=#6e738d,bg=#24273a] #I:#W "
setw -g window-status-current-format "#[fg=#24273a,bg=#c6a0f6]#[fg=#24273a,bg=#c6a0f6,bold] #I:#W #[fg=#c6a0f6,bg=#24273a]"

# Pane borders, messages and copy-mode selection were left at tmux defaults
# (green/yellow), which clashed with the Catppuccin Macchiato status bar above.
set -g pane-border-style        "fg=#494d64"
set -g pane-active-border-style "fg=#c6a0f6"
set -g message-style            "bg=#363a4f,fg=#cad3f5"
set -g message-command-style    "bg=#363a4f,fg=#cad3f5"
set -g mode-style               "bg=#494d64,fg=#cad3f5"

# ── Copy mode (vi) ─────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
