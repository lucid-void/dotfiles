{{/*
  The contents of /etc/bluetooth/main.conf.

  This is a .chezmoitemplates file rather than a normal source file because its
  target is not under $HOME, so chezmoi cannot manage it as a dotfile. BlueZ has
  no drop-in directory and no per-user config — bluetoothd runs as root and
  reads exactly one main.conf — so run_onchange_setup_bluetooth.sh.tmpl inlines
  this file and installs it with sudo. Keeping the config here rather than in a
  heredoc inside that script means editing it changes the rendered script, which
  is what makes run_onchange_ notice and re-run.

  Only overrides belong here. bluetoothd compiles in a default for every key it
  does not find, so omitting the ~400 lines of commented-out upstream defaults
  keeps this file from having to be reconciled every time bluez ships a new one.
*/ -}}
# /etc/bluetooth/main.conf — managed by chezmoi, do not edit in place.
# Source: dots/.chezmoitemplates/bluetooth-main.conf

[General]
# MPMD (Multiple Profiles Multiple Devices) is the Multi-Profile Specification
# mode covering a peripheral that holds profiles against more than one host at
# once — i.e. exactly what a multipoint headset does. Default is "off", which
# declares no MPS support at all.
#
# This one is a genuine experiment, not a known-good setting: what a remote
# device does with the declaration is up to its firmware. If Bluetooth gets
# worse rather than better, this is the first line to drop.
MultiProfile = multiple

# Keeps page scan active so the adapter answers quickly when a headset that
# wandered off to its other host tries to come back, instead of waiting out a
# scan interval. Default is false. Tradeoff is slightly higher idle power,
# which is not a concern on a desktop.
FastConnectable = true

# Deliberately not set: ReconnectAttempts and ReconnectIntervals. Their
# defaults are already 7 and 1,2,4,8,16,32,64 — writing those values here
# would look like tuning while changing nothing.
